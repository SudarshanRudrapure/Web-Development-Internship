<!DOCTYPE html>
<html>
<head>
    <title>Function Example</title>
</head>
<body>

    <button onclick="showMessage()">Click Me</button>

    <script>

        function showMessage() {
            alert("Welcome to the Web");
        }

    </script>

</body>
</html>

<!-- /*
function → Used to create function
onclick → Calls function when button is clicked
alert() → Displays popup message
*/ -->
