<!DOCTYPE html>
<html>
<head>
    <title>Simple Example</title>
</head>
<body>

    <h1 id="demo"></h1>

    <button onclick="showData()">Click Here</button>

    <script>

        // Variable
        let studentName = "Sudarshan";

        // Function
        function showData() {

            document.getElementById("demo").innerHTML =
            "Welcome " + studentName;

        }

    </script>

</body>
</html>
